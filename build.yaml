name: "PDF Thumbnails"
guid: "a5e3a6c8-2d4b-4f3e-9c1a-7b8d6e5f4a2c"
version: "1.1.1.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Generates thumbnail images from the first page of PDF files."
description: >
  Automatically generates cover thumbnails for PDF files in your Jellyfin library
  by rendering the first page of each PDF. Supports configurable render resolution
  (DPI) and thumbnail padding mode (white, transparent, or no padding).
category: "General"
owner: "ricardo3m"
artifacts:
  - "Jellyfin.Plugin.Pdf.dll"
  - "PDFtoImage.dll"
  - "SixLabors.ImageSharp.dll"
  - "UglyToad.PdfPig.dll"
  - "UglyToad.PdfPig.Core.dll"
  - "UglyToad.PdfPig.DocumentLayoutAnalysis.dll"
  - "UglyToad.PdfPig.Fonts.dll"
  - "UglyToad.PdfPig.Package.dll"
  - "UglyToad.PdfPig.Tokenization.dll"
  - "UglyToad.PdfPig.Tokens.dll"
  - "THIRD-PARTY-NOTICES.txt"
changelog: |-
  - Fix: embedded full-page image extraction could produce a cropped-looking cover for PDFs where the first page's image is placed relative to a MediaBox that is offset/larger than the page's own CropBox (seen in some newspaper/imposed PDF exports)
  - The full-page-image detection now compares the image's placement against the page's CropBox using intersection-over-union instead of a plain area ratio, so images that only partially overlap the visible page (or extend well beyond it as bleed) correctly fall back to full rasterization instead of being extracted as-is
